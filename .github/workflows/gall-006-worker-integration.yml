name: GALL-006 Worker Integration Court

on:
  pull_request:
    branches:
      - gall/checkpoint-006-fresh-consumer
    paths:
      - "src/gall-cli.ts"
      - "src/gall-work.ts"
      - "src/launcher.ts"
      - "test/gall-work.test.ts"
      - "test/runtime/gall-fresh-consumer.test.ts"
      - "test/runtime/gall-work-e2e.test.ts"
      - ".github/workflows/gall-006-worker-integration.yml"
  workflow_dispatch:

concurrency:
  group: gall-006-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exact-subject:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Execute fresh-consumer, typed-worker, and mocked-lifecycle courts
        run: bun test test/gall-work.test.ts test/runtime/gall-fresh-consumer.test.ts test/runtime/gall-work-e2e.test.ts
