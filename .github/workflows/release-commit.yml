name: Publish commit preview

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcode-cli-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1

      - name: Install extraction tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ZCODE_REQUIRE_TOOLCHAINS=1 turns a missing ggen into a hard failure
      # (test/ocel-reuse.test.ts fixed-point + mutation courts). Pin the exact
      # ggen release and verify its published sha256 before putting it on PATH.
      - name: Install pinned ggen v26.9.18 and marketplace packs
        env:
          GGEN_VERSION: v26.9.18
          GGEN_ASSET: ggen-x86_64-unknown-linux-gnu.tar.gz
          GGEN_SHA256: 9f1d689d26c5628aa695ab775f3045387f54d17c07abb8383caf0ad88a5c09e4
          GGEN_MARKETPLACE_SHA: 5eb71f7ed947f705a8d6b145cb9b0be82855d793
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/$GGEN_ASSET" "https://github.com/seanchatmangpt/ggen/releases/download/$GGEN_VERSION/$GGEN_ASSET"
          echo "$GGEN_SHA256  $RUNNER_TEMP/$GGEN_ASSET" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ggen-bin"
          tar -xzf "$RUNNER_TEMP/$GGEN_ASSET" -C "$RUNNER_TEMP/ggen-bin"
          echo "$RUNNER_TEMP/ggen-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ggen-bin/ggen" --version
          # scripts/gen-ocel.ts --check also needs the four marketplace packs
          # (default /Users/sac/ggen-marketplace/packs). Pin them by commit.
          mp="$RUNNER_TEMP/ggen-marketplace"
          git init -q "$mp"
          git -C "$mp" remote add origin https://github.com/seanchatmangpt/ggen-marketplace
          git -C "$mp" sparse-checkout set packs/process-intelligence-pack packs/state-transition-pack packs/evidence-standing-pack packs/shacl-projection-pack
          git -C "$mp" fetch -q --depth 1 --filter=blob:none origin "$GGEN_MARKETPLACE_SHA"
          git -C "$mp" checkout -q FETCH_HEAD
          test "$(git -C "$mp" rev-parse HEAD)" = "$GGEN_MARKETPLACE_SHA"
          echo "ZCODE_PACK_ROOT=$mp/packs" >> "$GITHUB_ENV"

      - name: Build and test the locked runtime
        run: bun run release:build

      - name: Pack and install-test
        id: pack
        run: bun run release:pack

      - name: Verify release metadata is unchanged
        run: git diff --exit-code -- package.json zcode-runtime.lock.json

      - name: Upload tested package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commit-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .release/*.tgz
            .release/release.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      # Install https://github.com/apps/pkg-pr-new on this repository first.
      # Upload the exact tarball that passed the install smoke test, without repacking it.
      - name: Publish commit package
        env:
          PREVIEW_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: bun run pkg-pr-new publish "$PREVIEW_TARBALL" --bin --comment=update --commentWithSha --no-template --json .release/preview.json

      - name: Show preview command
        run: |
          jq -r '.packages[] | "Preview package: \(.url)\n\n```sh\nnpx --yes \(.url) --resume <session-id>\n```"' .release/preview.json >> "$GITHUB_STEP_SUMMARY"
