name: Publish commit preview

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zcode-cli-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1

      - name: Install extraction tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ZCODE_REQUIRE_TOOLCHAINS=1 turns a missing ggen into a hard failure
      # (test/ocel-reuse.test.ts fixed-point + mutation courts). The pins live
      # only in .github/actions/ggen-toolchain; test/release-workflows.test.ts
      # refuses any job that needs the toolchain without this step.
      - name: Install pinned ggen toolchain
        uses: ./.github/actions/ggen-toolchain

      - name: Build and test the locked runtime
        run: bun run release:build

      - name: Pack and install-test
        id: pack
        run: bun run release:pack

      - name: Verify release metadata is unchanged
        run: git diff --exit-code -- package.json zcode-runtime.lock.json

      - name: Upload tested package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commit-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .release/*.tgz
            .release/release.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      # The pkg-pr-new App (https://github.com/apps/pkg-pr-new) must be
      # installed on the repository for the publish to work. When it is not,
      # the CLI exits 1 with a 404 naming the app. That is a repo-configuration
      # state, not a build defect — classify it as a typed skip so the standing
      # red cannot mask real publish regressions (falsified 2026-09-26: PRs
      # #9/#12/#14 all carried this red while build/pack/upload were green).
      # Any other publish failure still fails the job.
      - name: Publish commit package
        env:
          PREVIEW_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -o pipefail
          if bun run pkg-pr-new publish "$PREVIEW_TARBALL" --bin --comment=update --commentWithSha --no-template --json .release/preview.json 2>&1 | tee /tmp/pkg-pr-new-publish.log; then
            echo "preview publish: ok"
          elif grep -q "apps/pkg-pr-new is not installed" /tmp/pkg-pr-new-publish.log; then
            echo "::warning::pkg-pr-new App is not installed on this repository; commit preview not published. Build, pack, install smoke test and artifact upload above are still verified. Install https://github.com/apps/pkg-pr-new to enable preview publishes."
            echo "### Preview publish skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The pkg-pr-new App is not installed on this repository, so no commit-preview package was published. The tarball that passed the install smoke test is in the \`commit-preview-*\` artifact above." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "preview publish failed (not the known app-not-installed case):"
            cat /tmp/pkg-pr-new-publish.log
            exit 1
          fi

      - name: Show preview command
        if: hashFiles('.release/preview.json') != ''
        run: |
          jq -r '.packages[] | "Preview package: \(.url)\n\n```sh\nnpx --yes \(.url) --resume <session-id>\n```"' .release/preview.json >> "$GITHUB_STEP_SUMMARY"
